name: Build Mac app
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Create config from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cat > scanner_config.mac.toml <<EOF
          [supabase]
          url = "$SUPABASE_URL"
          key = "$SUPABASE_KEY"

          [scanner]
          ports = []
          baud_rate = 9600
          debounce_seconds = 3
          sound_enabled = false
          EOF
      - name: Build
        run: |
          pyinstaller --windowed --noconfirm \
            --name "Scanner Companion" \
            --add-data "README.txt:." \
            --add-data "scanner_config.mac.toml:." \
            scanner_app.py
      - name: Zip
        run: ditto -c -k --keepParent "dist/Scanner Companion.app" ScannerCompanion-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ScannerCompanion-mac
          path: ScannerCompanion-mac.zip
